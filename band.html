<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palco Band - Dashboard Live</title>
  <style>
    body { font-family: sans-serif; background: #000; color: #fff; padding: 20px; text-align: center; }
    .card { background: #1a1a1a; border: 3px solid #ff9800; border-radius: 15px; padding: 30px; margin-top: 20px; }
    .title { font-size: 2.5em; color: #ff9800; font-weight: bold; margin-bottom: 10px; }
    .artist { font-size: 1.8em; color: #ccc; }
    .dedica { font-size: 1.5em; color: #00e676; margin-top: 20px; font-style: italic; }
    .suggeriti { margin-top: 40px; text-align: left; background: #111; padding: 15px; border-radius: 10px; }
    .top-song { color: #ff9800; font-weight: bold; font-size: 1.2em; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h1>PROSSIMO BRANO DA SUONARE</h1>

  <div class="card">
    <div id="live-title" class="title">In attesa di richieste...</div>
    <div id="live-artist" class="artist"></div>
    <div id="live-dedica" class="dedica"></div>
  </div>

  <div class="suggeriti">
    <h2>Brani Proposti pronti per la Scaletta (≥ 10 Voti)</h2>
    <div id="goals-list">Nessun brano ha ancora raggiunto 10 voti.</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    
    const firebaseConfig = {
      apiKey: AIzaSyDqH7id1aRXulq9CfVjLn9TDu4QYX9Paao"",
      authDomain: "dual-shock-live.firebaseapp.com",
      databaseURL: "https://dual-shock-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dual-shock-live",
      storageBucket: "dual-shock-live.firebasestorage.app",
      messagingSenderId: "231528691879",
      appId: "1:231528691879:web:1e0fdcea4a8f17815e0382"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Ascolta la scelta del pubblico in tempo reale
    onValue(ref(db, 'richiesta_live'), (snapshot) => {
      const data = snapshot.val();
      if(data) {
        document.getElementById('live-title').innerText = data.titolo;
        document.getElementById('live-artist').innerText = "di " + data.artista;
        document.getElementById('live-dedica').innerText = data.dedica ? "Dedica: " + data.dedica : "";
      }
    });

    // Ascolta i brani che raggiungono i 10 voti
    onValue(ref(db, 'proposte'), (snapshot) => {
      const data = snapshot.val();
      const list = document.getElementById('goals-list');
      list.innerHTML = '';
      let pronti = false;

      if(data) {
        Object.keys(data).forEach(id => {
          if(data[id].voti >= 10) {
            pronti = true;
            list.innerHTML += `<div class="top-song">🔥 ${data[id].titolo} - ${data[id].artista} (${data[id].voti} Voti)</div>`;
          }
        });
      }
      if(!pronti) list.innerHTML = 'Nessun brano ha ancora raggiunto 10 voti.';
    });
  </script>
</body>
</html>
