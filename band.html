<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Palco - Dual Shock</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --primary: #00bcd4; --text: #ffffff; --subtext: #aaa; --danger: #f44336; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
    .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; }
    .req-info { display: flex; flex-direction: column; gap: 4px; }
    .req-song { font-size: 1.1em; font-weight: bold; color: var(--primary); }
    .req-user { font-weight: bold; font-size: 0.95em; }
    .req-msg { font-style: italic; color: #4caf50; font-size: 0.9em; }
    .btn-done { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .btn-clear-all { background: var(--danger); color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px; }
    .empty-msg { text-align: center; color: var(--subtext); margin-top: 40px; font-size: 1.1em; }
  </style>
</head>
<body>

  <h1>📡 Richieste Live in Tempo Reale</h1>
  
  <button class="btn-clear-all" onclick="svuotaTutto()">🗑️ Azzera tutte le richieste (Fine Serata)</button>

  <div id="requests-container">
    <p class="empty-msg">Nessuna richiesta al momento...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqH7id1aRXulq9CfVjLn9TDu4QYX9Paao",
      authDomain: "dual-shock-live.firebaseapp.com",
      databaseURL: "https://dual-shock-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dual-shock-live",
      storageBucket: "dual-shock-live.firebasestorage.app",
      messagingSenderId: "231528691879",
      appId: "1:231528691879:web:1e0fdcea4a8f17815e0382"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById('requests-container');

    onValue(ref(db, 'richiesta_live'), (snapshot) => {
      const data = snapshot.val();
      container.innerHTML = '';

      if(!data) {
        container.innerHTML = '<p class="empty-msg">Nessuna richiesta al momento...</p>';
        return;
      }

      Object.keys(data).forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="req-info">
            <span class="req-song">🎵 ${item.song}</span>
            <span class="req-user">👤 Da: ${item.name}</span>
            ${item.message ? `<span class="req-msg">💬 "${item.message}"</span>` : ''}
          </div>
          <button class="btn-done" onclick="rimuovi('${key}')">✓ Fatta</button>
        `;
        container.appendChild(card);
      });
    });

    window.rimuovi = (key) => {
      remove(ref(db, 'richiesta_live/' + key));
    };

    window.svuotaTutto = () => {
      if(confirm('Vuoi davvero cancellare tutte le richieste arrivate stasera?')) {
        remove(ref(db, 'richiesta_live'));
      }
    };
  </script>
</body>
</html>
