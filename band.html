<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Shock Live - Dashboard Palco</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #162032;
      --primary: #00bcd4;
      --text: #ffffff;
      --subtext: #b0b0b0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
    }
    .section {
      background: var(--card);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .card {
      background: #1d2a44;
      border-left: 5px solid var(--primary);
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .req-song {
      font-weight: bold;
      font-size: 1.1em;
      color: var(--primary);
    }
    .req-user {
      font-size: 0.9em;
      color: var(--subtext);
    }
    .req-msg {
      font-style: italic;
      color: #ffeb3b;
      font-size: 0.9em;
    }
    button {
      font-weight: bold;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:active {
      opacity: 0.8;
    }
    .btn-done {
      background: #4caf50;
      color: #fff;
      align-self: flex-end;
      margin-top: 5px;
    }
    .btn-clear-all {
      background: #f44336;
      color: #fff;
      width: 100%;
      margin-bottom: 20px;
    }
    .btn-concert {
      width: 100%;
      padding: 12px;
      font-size: 1.1em;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1d2a44;
      color: #fff;
      box-sizing: border-box;
    }
    .empty-msg {
      color: var(--subtext);
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>📡 Dashboard Palco</h1>

  <!-- PULSANTE STATO CONCERTO -->
  <button id="btnConcerto" class="btn-concert" onclick="toggleConcerto()">🟢 Inizia Concerto</button>

  <button class="btn-clear-all" onclick="svuotaTutto()">🗑️ Azzera tutte le richieste attive</button>

  <div class="section">
    <h2>🎵 Richieste Live in Tempo Reale</h2>
    <div id="requests-container">
      <p class="empty-msg">Nessuna richiesta al momento...</p>
    </div>
  </div>

  <div class="section">
    <h2>📚 Storico Brani Suonati (<span id="total-count">0</span>)</h2>
    <div id="history-container">
      <p class="empty-msg">Nessun brano nello storico...</p>
    </div>
    <button onclick="azzeraStorico()" style="background: #d32f2f; color: #fff; width: 100%; margin-top: 10px;">🗑️ Azzera Storico</button>
  </div>

  <!-- CLASSIFICA UTENTI SPOSTATA QUI SOTTO -->
  <div class="section">
    <h2>🏆 Classifica Richieste (Fine Concerto)</h2>
    <div id="leaderboard-container">
      <p class="empty-msg">Nessuna statistica disponibile...</p>
    </div>
  </div>

  <!-- SEZIONE GESTIONE PROSSIMI LIVE IN FONDO CON BLOCCHI SEPARATI -->
  <div class="section">
    <h2>📅 Gestione Prossimi Live</h2>
    <label style="font-weight: bold; color: var(--primary);">Data concerto:</label>
    <input type="text" id="showData" placeholder="Es. Sabato 15 Agosto - Ore 21:30">

    <label style="font-weight: bold; color: var(--primary); margin-top: 10px; display: block;">Locale:</label>
    <input type="text" id="showLocale" placeholder="Es. Pub Il Bancone">

    <label style="font-weight: bold; color: var(--primary); margin-top: 10px; display: block;">Città:</label>
    <input type="text" id="showCitta" placeholder="Es. Roma (RM)">

    <button onclick="aggiungiLive()" style="background: var(--primary); color: #000; width: 100%; margin-top: 15px;">➕ Aggiungi Prossimo Live</button>
    
    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
    
    <h3>Concerti in Programma:</h3>
    <div id="band-shows-list">
      <p class="empty-msg">Nessun live inserito.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqH7id1aRXulq9CfVjLn9TDu4QYX9Paao",
      authDomain: "dual-shock-live.firebaseapp.com",
      databaseURL: "https://dual-shock-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dual-shock-live",
      storageBucket: "dual-shock-live.firebasestorage.app",
      messagingSenderId: "231528691879",
      appId: "1:231528691879:web:1e0fdcea4a8f17815e0382"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById('requests-container');
    const historyContainer = document.getElementById('history-container');
    const totalCountEl = document.getElementById('total-count');
    const btnConcerto = document.getElementById('btnConcerto');
    const bandShowsList = document.getElementById('band-shows-list');

    let rawRichieste = null;
    let rawStorico = null;

    // Gestione stato concerto (chiuso = true, attivo = false)
    onValue(ref(db, 'concerto_chiuso'), (snapshot) => {
      const chiuso = snapshot.val() === true;
      if(chiuso) {
        btnConcerto.style.background = '#4caf50';
        btnConcerto.style.color = '#fff';
        btnConcerto.innerText = '🟢 Inizia Concerto (Clicca per riattivare)';
      } else {
        btnConcerto.style.background = '#f44336';
        btnConcerto.style.color = '#fff';
        btnConcerto.innerText = '🔴 Fine Concerto (Clicca per bloccare)';
      }
    });

    window.toggleConcerto = () => {
      const isCurrentlyClosed = btnConcerto.innerText.includes('Inizia');
      set(ref(db, 'concerto_chiuso'), !isCurrentlyClosed);
    };

    function calculateUserCounts() {
      const counts = {};
      if (rawRichieste) {
        Object.values(rawRichieste).forEach(item => {
          if (item && item.name) {
            const nameKey = item.name.trim().toLowerCase();
            if (!counts[nameKey]) counts[nameKey] = { name: item.name, total: 0 };
            counts[nameKey].total++;
          }
        });
      }
      if (rawStorico) {
        Object.values(rawStorico).forEach(item => {
          if (item && item.name) {
            const nameKey = item.name.trim().toLowerCase();
            if (!counts[nameKey]) counts[nameKey] = { name: item.name, total: 0 };
            counts[nameKey].total++;
          }
        });
      }
      return counts;
    }

    function renderLeaderboard() {
      const leaderboardContainer = document.getElementById('leaderboard-container');
      if (!leaderboardContainer) return;
      
      const counts = calculateUserCounts();
      const sortedUsers = Object.values(counts).sort((a, b) => b.total - a.total);
      
      if (sortedUsers.length === 0) {
        leaderboardContainer.innerHTML = '<p class="empty-msg">Nessuna statistica disponibile...</p>';
        return;
      }
      
      let html = '<div style="display: flex; flex-direction: column; gap: 8px;">';
      sortedUsers.forEach((user, index) => {
        let medal = '';
        if (index === 0) medal = '🥇 ';
        else if (index === 1) medal = '🥈 ';
        else if (index === 2) medal = '🥉 ';
        else medal = `${index + 1}. `;
        
        html += `
          <div style="display: flex; justify-content: space-between; background: #1d2a44; padding: 8px 12px; border-radius: 6px; align-items: center;">
            <span>${medal}<strong>${user.name}</strong></span>
            <span style="background: var(--primary); color: #000; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.9em;">${user.total} ${user.total === 1 ? 'richiesta' : 'richieste'}</span>
          </div>
        `;
      });
      html += '</div>';
      leaderboardContainer.innerHTML = html;
    }

    function renderAll() {
      // 1. Render richieste in tempo reale
      container.innerHTML = '';
      if(!rawRichieste) {
        container.innerHTML = '<p class="empty-msg">Nessuna richiesta al momento...</p>';
      } else {
        const userCounts = calculateUserCounts();
        Object.keys(rawRichieste).forEach(key => {
          const item = rawRichieste[key];
          const nameKey = item.name ? item.name.trim().toLowerCase() : '';
          const userTotal = userCounts[nameKey] ? userCounts[nameKey].total : 1;

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <span class="req-song">🎵 ${item.song}</span>
            <span class="req-user">👤 Da: ${item.name} — <b>Richiesta n. ${userTotal}</b></span>
            ${item.message ? `<span class="req-msg">💬 "${item.message}"</span>` : ''}
            <button class="btn-done" onclick="spostaInStorico('${key}', '${item.song.replace(/'/g, "\\'")}', '${item.name.replace(/'/g, "\\'")}')">✓ Fatta</button>
          `;
          container.appendChild(card);
        });
      }

      // 2. Render storico
      historyContainer.innerHTML = '';
      if(!rawStorico) {
        historyContainer.innerHTML = '<p class="empty-msg">Nessun brano nello storico...</p>';
        totalCountEl.innerText = '0';
      } else {
        const keys = Object.keys(rawStorico);
        totalCountEl.innerText = keys.length;
        keys.forEach(key => {
          const item = rawStorico[key];
          const card = document.createElement('div');
          card.className = 'card';
          card.style.borderLeftColor = '#4caf50';
          card.innerHTML = `
            <span class="req-song">🎵 ${item.song}</span>
            <span class="req-user">👤 Suonato per: ${item.name}</span>
          `;
          historyContainer.appendChild(card);
        });
      }

      // 3. Render classifica
      renderLeaderboard();
    }

    onValue(ref(db, 'richiesta_live'), (snapshot) => {
      rawRichieste = snapshot.val();
      renderAll();
    });

    onValue(ref(db, 'storico_live'), (snapshot) => {
      rawStorico = snapshot.val();
      renderAll();
    });

    window.spostaInStorico = (key, song, name) => {
      push(ref(db, 'storico_live'), {
        song: song,
        name: name,
        timestamp: Date.now()
      }).then(() => {
        remove(ref(db, 'richiesta_live/' + key));
      });
    };

    window.svuotaTutto = () => {
      if(confirm('Vuoi davvero cancellare tutte le richieste attive?')) {
        remove(ref(db, 'richiesta_live'));
      }
    };

    window.azzeraStorico = () => {
      if(confirm('Vuoi azzerare lo storico dei brani suonati?')) {
        remove(ref(db, 'storico_live'));
      }
    };

    window.aggiungiLive = () => {
      const data = document.getElementById('showData').value.trim();
      const locale = document.getElementById('showLocale').value.trim();
      const citta = document.getElementById('showCitta').value.trim();

      if(!data || !locale || !citta) {
        alert('Compila tutti i campi: Data, Locale e Città!');
        return;
      }

      push(ref(db, 'prossimi_live'), {
        date: data,
        venue: locale,
        city: citta,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('showData').value = '';
        document.getElementById('showLocale').value = '';
        document.getElementById('showCitta').value = '';
        alert('📅 Prossimo live aggiunto con successo!');
      }).catch(err => {
        alert('Errore: ' + err.message);
      });
    };

    onValue(ref(db, 'prossimi_live'), (snapshot) => {
      const data = snapshot.val();
      bandShowsList.innerHTML = '';
      if(!data) {
        bandShowsList.innerHTML = '<p class="empty-msg">Nessun live inserito.</p>';
        return;
      }
      Object.keys(data).forEach(key => {
        const show = data[key];
        const div = document.createElement('div');
        div.className = 'card';
        div.style.borderLeftColor = '#ffc107';
        div.innerHTML = `
          <div>📅 <strong>${show.date}</strong></div>
          <div>📍 Locale: <strong>${show.venue}</strong></div>
          <div>🏙️ Città: <strong>${show.city}</strong></div>
          <button onclick="eliminaLive('${key}')" style="background: #f44336; color: #fff; padding: 6px 10px; margin-top: 8px; align-self: flex-start;">🗑️ Elimina</button>
        `;
        bandShowsList.appendChild(div);
      });
    });

    window.eliminaLive = (key) => {
      if(confirm('Vuoi eliminare questo live dalla programmazione?')) {
        remove(ref(db, 'prossimi_live/' + key));
      }
    };
  </script>
</body>
</html>
