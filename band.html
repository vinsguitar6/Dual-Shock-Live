<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Band - Dual Shock Live</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --primary: #00bcd4; --text: #ffffff; --subtext: #aaa; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    h1, h2 { text-align: center; color: var(--primary); margin-bottom: 15px; }
    .section { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    
    /* Buttons */
    button { background: var(--primary); color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    button:active { opacity: 0.8; }
    
    .btn-clear-all { background: #d32f2f; color: #fff; width: 100%; margin-bottom: 15px; }
    .btn-done { background: #388e3c; color: #fff; padding: 6px 12px; font-size: 0.85em; }
    .btn-delete { background: #d32f2f; color: #fff; padding: 6px 12px; font-size: 0.85em; }
    .btn-toggle { width: 100%; padding: 12px; font-size: 1em; margin-bottom: 15px; background: #c62828; color: #fff; }
    .btn-toggle.active { background: #2e7d32; color: #fff; }

    /* Cards */
    .card { background: #2a2a2a; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
    .req-info { display: flex; flex-direction: column; gap: 4px; }
    .req-song { font-weight: bold; font-size: 1.05em; color: #fff; }
    .req-user { font-size: 0.85em; color: var(--subtext); }
    .req-msg { font-size: 0.85em; color: #80deea; font-style: italic; }
    .empty-msg { text-align: center; color: var(--subtext); font-size: 0.9em; padding: 10px; }
  </style>
</head>
<body>

  <h1>🎸 DUAL SHOCK - PALCO</h1>

  <!-- TOGGLE CONCERTO CHIUSO / APERTO -->
  <button id="toggleConcertBtn" class="btn-toggle" onclick="toggleConcerto()">🔴 Fine Concerto (Blocca Richieste)</button>

  <!-- GESTIONE PROSSIMI LIVE -->
  <div class="section">
    <h2>📅 Gestione Prossimi Live</h2>
    <label for="liveDate" style="font-size: 0.9em; font-weight: bold;">Data e Ora (es. 15 Agosto - Ore 21:30):</label>
    <input type="text" id="liveDate" placeholder="Es. 15 Agosto - Ore 21:30">
    
    <label for="liveVenue" style="font-size: 0.9em; font-weight: bold; margin-top: 10px; display: block;">Locale / Città (es. Caffè Letterario, Roma):</label>
    <input type="text" id="liveVenue" placeholder="Es. Caffè Letterario, Roma">
    
    <button onclick="aggiungiLive()" style="width: 100%; margin-top: 10px;">➕ Aggiungi Concerto</button>
    
    <h3 style="font-size: 1em; color: var(--subtext); margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px;">Live in Programma:</h3>
    <div id="upcoming-admin-list">
      <p class="empty-msg">Nessun live inserito...</p>
    </div>
  </div>

  <!-- RICHIESTE LIVE -->
  <div class="section">
    <h2>📡 Richieste Live in Tempo Reale</h2>
    <button class="btn-clear-all" onclick="svuotaTutto()">🗑️ Azzera tutte le richieste (Fine Serata)</button>
    <div id="requests-container">
      <p class="empty-msg">Nessuna richiesta al momento...</p>
    </div>
  </div>

  <!-- STORICO BRANI FATTI -->
  <div class="section">
    <h2>📁 Storico / Brani Suonati (<span id="storico-count">0</span>)</h2>
    <button class="btn-clear-all" style="background: #444;" onclick="svuotaStorico()">🗑️ Svuota Storico</button>
    <div id="storico-container">
      <p class="empty-msg">Nessun brano nello storico...</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqH7id1aRXulq9CfVjLn9TDu4QYX9Paao",
      authDomain: "dual-shock-live.firebaseapp.com",
      databaseURL: "https://dual-shock-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dual-shock-live",
      storageBucket: "dual-shock-live.firebasestorage.app",
      messagingSenderId: "231528691879",
      appId: "1:231528691879:web:1e0fdcea4a8f17815e0382"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById('requests-container');
    const storicoContainer = document.getElementById('storico-container');
    const storicoCount = document.getElementById('storico-count');
    const upcomingAdminList = document.getElementById('upcoming-admin-list');
    const toggleBtn = document.getElementById('toggleConcertBtn');

    let concertClosedState = false;

    // Gestione Stato Concerto (Aperto/Chiuso)
    onValue(ref(db, 'concerto_chiuso'), (snapshot) => {
      concertClosedState = snapshot.val() === true;
      if (concertClosedState) {
        toggleBtn.className = "btn-toggle active";
        toggleBtn.innerText = "🟢 Inizio Concerto (Riattiva Richieste)";
      } else {
        toggleBtn.className = "btn-toggle";
        toggleBtn.innerText = "🔴 Fine Concerto (Blocca Richieste)";
      }
    });

    window.toggleConcerto = () => {
      const newState = !concertClosedState;
      set(ref(db, 'concerto_chiuso'), newState).then(() => {
        alert(newState ? '⚠️ Concerto chiuso! Le richieste sono state bloccate nelle pagine index.' : '✨ Concerto aperto! Le richieste sono state riattivate.');
      });
    };

    // Aggiungi un nuovo concerto
    window.aggiungiLive = () => {
      const date = document.getElementById('liveDate').value.trim();
      const venue = document.getElementById('liveVenue').value.trim();

      if (!date || !venue) {
        alert('Compila sia la data che il locale/città!');
        return;
      }

      push(ref(db, 'prossimi_live'), {
        date: date,
        venue: venue
      }).then(() => {
        alert('📅 Concerto aggiunto con successo!');
        document.getElementById('liveDate').value = '';
        document.getElementById('liveVenue').value = '';
      }).catch(err => {
        alert('Errore: ' + err.message);
      });
    };

    // Cancella un singolo concerto dalla lista
    window.eliminaLive = (key) => {
      remove(ref(db, 'prossimi_live/' + key));
    };

    // Ascolta e mostra i concerti nella pagina band con tasto elimina
    onValue(ref(db, 'prossimi_live'), (snapshot) => {
      const data = snapshot.val();
      upcomingAdminList.innerHTML = '';
      if (!data) {
        upcomingAdminList.innerHTML = '<p class="empty-msg">Nessun live inserito...</p>';
        return;
      }
      Object.keys(data).forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="req-info">
            <span class="req-song">📅 ${item.date}</span>
            <span class="req-user">📍 ${item.venue}</span>
          </div>
          <button class="btn-delete" onclick="eliminaLive('${key}')">🗑️ Elimina</button>
        `;
        upcomingAdminList.appendChild(card);
      });
    });

    // Gestione Richieste Attive
    onValue(ref(db, 'richiesta_live'), (snapshot) => {
      const data = snapshot.val();
      container.innerHTML = '';

      if(!data) {
        container.innerHTML = '<p class="empty-msg">Nessuna richiesta al momento...</p>';
        return;
      }

      Object.keys(data).forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="req-info">
            <span class="req-song">🎵 ${item.song}</span>
            <span class="req-user">👤 Da: ${item.name}</span>
            ${item.message ? `<span class="req-msg">💬 "${item.message}"</span>` : ''}
          </div>
          <button class="btn-done" onclick="rimuovi('${key}', '${item.song.replace(/'/g, "\\'")}', '${item.name.replace(/'/g, "\\'")}', '${(item.message || '').replace(/'/g, "\\'")}')">✓ Fatta</button>
        `;
        container.appendChild(card);
      });
    });

    // Sposta in Storico quando clicchi su Fatta
    window.rimuovi = (key, song, name, message) => {
      push(ref(db, 'storico_live'), {
        song: song,
        name: name,
        message: message,
        timestamp: Date.now()
      }).then(() => {
        remove(ref(db, 'richiesta_live/' + key));
      });
    };

    window.svuotaTutto = () => {
      if(confirm('Vuoi davvero cancellare tutte le richieste arrivate stasera?')) {
        remove(ref(db, 'richiesta_live'));
      }
    };

    // Gestione Storico
    onValue(ref(db, 'storico_live'), (snapshot) => {
      const data = snapshot.val();
      storicoContainer.innerHTML = '';

      if(!data) {
        storicoCount.innerText = '0';
        storicoContainer.innerHTML = '<p class="empty-msg">Nessun brano nello storico...</p>';
        return;
      }

      const keys = Object.keys(data);
      storicoCount.innerText = keys.length;

      keys.forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.style.borderLeftColor = '#388e3c';
        card.innerHTML = `
          <div class="req-info">
            <span class="req-song">🎵 ${item.song}</span>
            <span class="req-user">👤 Da: ${item.name}</span>
            ${item.message ? `<span class="req-msg">💬 "${item.message}"</span>` : ''}
          </div>
        `;
        storicoContainer.appendChild(card);
      });
    });

    window.svuotaStorico = () => {
      if(confirm('Vuoi azzerare lo storico dei brani suonati?')) {
        remove(ref(db, 'storico_live'));
      }
    };
  </script>
</body>
</html>
