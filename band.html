<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Palco - Dual Shock Live</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --primary: #00bcd4; --text: #ffffff; --subtext: #aaa; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    h1, h2 { text-align: center; color: var(--primary); margin-bottom: 15px; }
    .section { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    .card { background: #2a2a2a; border-left: 4px solid var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .req-info { display: flex; flex-direction: column; gap: 4px; }
    .req-song { font-weight: bold; font-size: 1.1em; color: #fff; }
    .req-user { font-size: 0.9em; color: var(--primary); }
    .req-msg { font-size: 0.85em; color: var(--subtext); font-style: italic; }
    
    .btn-done { background: #4caf50; color: #fff; font-weight: bold; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .btn-done:active { opacity: 0.8; }
    
    .history-card { background: #222; border-left: 4px solid #888; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; opacity: 0.8; }
    
    .btn-clear-all { background: #f44336; color: #fff; font-weight: bold; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1em; }
    .empty-msg { text-align: center; color: var(--subtext); font-style: italic; padding: 10px; }
    
    .counter-badge { background: var(--primary); color: #000; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.9em; }
  </style>
</head>
<body>

  <h1>📡 Richieste Live in Tempo Reale</h1>

  <!-- SEZIONE RICHIESTE ATTIVE -->
  <div class="section">
    <h2>In Attesa</h2>
    <div id="requests-container">
      <p class="empty-msg">Nessuna richiesta al momento...</p>
    </div>
  </div>

  <!-- CARTELLA STORICO / BRANI FATTI -->
  <div class="section">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h2 style="margin: 0;">📁 Cartella Storico Brani</h2>
      <span id="total-count" class="counter-badge">Totale: 0</span>
    </div>
    <div id="history-container">
      <p class="empty-msg">Nessun brano suonato finora...</p>
    </div>
    <button class="btn-clear-all" onclick="svuotaTutto()">🗑️ Elimina tutto e azzera per il prossimo live</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqH7id1aRXulq9CfVjLn9TDu4QYX9Paao",
      authDomain: "dual-shock-live.firebaseapp.com",
      databaseURL: "https://dual-shock-live-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dual-shock-live",
      storageBucket: "dual-shock-live.firebasestorage.app",
      messagingSenderId: "231528691879",
      appId: "1:231528691879:web:1e0fdcea4a8f17815e0382"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById('requests-container');
    const historyContainer = document.getElementById('history-container');
    const totalCountEl = document.getElementById('total-count');

    // Ascolta le richieste attive
    onValue(ref(db, 'richiesta_live'), (snapshot) => {
      const data = snapshot.val();
      container.innerHTML = '';

      if (!data) {
        container.innerHTML = '<p class="empty-msg">Nessuna richiesta al momento...</p>';
        return;
      }

      Object.keys(data).forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="req-info">
            <span class="req-song">🎵 ${item.song}</span>
            <span class="req-user">👤 Da: ${item.name}</span>
            ${item.message ? `<span class="req-msg">💬 "${item.message}"</span>` : ''}
          </div>
          <button class="btn-done" onclick="segnaFatta('${key}', '${item.song.replace(/'/g, "\\'")}', '${item.name.replace(/'/g, "\\'")}', '${item.message ? item.message.replace(/'/g, "\\'") : ''}')">✓ Fatta</button>
        `;
        container.appendChild(card);
      });
    });

    // Ascolta lo storico (cartella brani fatti)
    onValue(ref(db, 'storico_live'), (snapshot) => {
      const data = snapshot.val();
      historyContainer.innerHTML = '';

      if (!data) {
        historyContainer.innerHTML = '<p class="empty-msg">Nessun brano suonato finora...</p>';
        totalCountEl.innerText = 'Totale: 0';
        return;
      }

      const keys = Object.keys(data);
      totalCountEl.innerText = `Totale: ${keys.length}`;

      keys.forEach(key => {
        const item = data[key];
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="req-info">
            <span class="req-song" style="font-size: 1em;">🎵 ${item.song}</span>
            <span class="req-user" style="font-size: 0.8em;">👤 Da: ${item.name}</span>
          </div>
          <span style="font-size: 0.8em; color: #4caf50; font-weight: bold;">✔ Suonato</span>
        `;
        historyContainer.appendChild(card);
      });
    });

    // Funzione quando si clicca "Fatta": sposta da richiesta_live a storico_live
    window.segnaFatta = (key, song, name, message) => {
      // 1. Aggiunge allo storico
      push(ref(db, 'storico_live'), {
        song: song,
        name: name,
        message: message,
        completedAt: Date.now()
      }).then(() => {
        // 2. Rimuove dalle richieste attive
        remove(ref(db, 'richiesta_live/' + key));
      }).catch(err => {
        alert('Errore nello spostamento: ' + err.message);
      });
    };

    // Funzione per azzerare tutto (attive + storico) per la prossima live
    window.svuotaTutto = () => {
      if (confirm('Vuoi davvero cancellare tutte le richieste attive e svuotare la cartella dello storico per il prossimo live?')) {
        remove(ref(db, 'richiesta_live'));
        remove(ref(db, 'storico_live'));
      }
    };
  </script>
</body>
</html>
